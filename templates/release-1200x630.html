<!DOCTYPE html>
<!-- Email and link-preview graphic, 1200 x 630. Edit the text in the marked spots, then run scripts/render.sh. -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="release.css">
<style>
  .frame { width: 1200px; height: 630px; }
  .row.r1 { top: 70px; transform: translateX(420px); }
  .row.r2 { top: 186px; transform: translateX(340px); }
  .row.r3 { top: 302px; transform: translateX(460px); }
  .row.r4 { top: 418px; transform: translateX(380px); }
  .copy { position: absolute; left: 64px; top: 64px; width: 560px; }
  .copy .label { font-size: 22px; }
  .headline { margin-top: 18px; font-size: 64px; }
  .edge-top { height: 48px; }
  .lockup { position: absolute; left: 64px; bottom: 56px; }
  .float { position: absolute; right: 56px; top: 196px; width: 470px; }
  .float .pill { margin-bottom: 18px; font-size: 18px; line-height: 24px; padding: 6px 14px; }
  .float .card { padding: 26px 28px; }
  .float .card-title { font-size: 24px; }
  .float .card-detail { font-size: 18px; }
  .float .chip { font-size: 16px; line-height: 22px; margin-top: 18px; }
</style></head>
<body>
<div class="frame">
  <div class="field">
    <div class="row r1"><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile scan"></div><div class="tile"></div></div>
    <div class="row r2"><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div></div>
    <div class="row r3"><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div></div>
    <div class="row r4"><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div></div>
  </div>
  <div class="veil"></div><div class="edge-top"></div><div class="edge-bottom"></div>
  <div class="copy">
    <!-- EDIT: release label -->
    <span class="label">Product update</span>
    <!-- EDIT: the claim -->
    <h1 class="headline">Repeat repairs get flagged first.</h1>
  </div>
  <div class="float">
    <!-- EDIT: status pill: live | rolling | pilot -->
    <span class="pill live">Live</span>
    <div class="card">
      <!-- EDIT: product card -->
      <div class="card-title">Dishwasher · Unit 214</div>
      <div class="card-detail">Not draining · 2 work orders · last serviced 14 Mar 2025</div>
      <span class="chip">Repeat repair</span>
    </div>
  </div>
  <img class="lockup" src="../brand/logos/verstack-lockup-white.svg" height="32" alt="Verstack">
</div>
</body></html>
