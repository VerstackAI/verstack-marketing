<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Field home</title>
<link rel="stylesheet" href="../templates/line.css">
<script src="motion.js"></script>
<style>body { background: var(--ground-900); margin: 0; } .frame { width: 1920px; height: 1080px; background: var(--ground-900); }
.hide { opacity: 0; }
.fit { overflow: hidden; }
.card { position: absolute; background: var(--mist); }
.sweep-clip { position: absolute; overflow: hidden; pointer-events: none; }
.sweep { position: absolute; top: 0; bottom: 0; left: -20%; width: 140%; opacity: 0.14; visibility: hidden;
  background: linear-gradient(90deg, #f8fafc 0%, #eefbd7 12%, #d8f7a3 26%, #baf85d 42%, #a5fc22 58%, #8ff741 74%, #7ff553 100%);
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.15) 7%, #000 22%, #000 78%, rgba(0,0,0,.15) 93%, transparent 100%); }
.leader { fill: none; stroke: #30303a; stroke-width: 1.5; }
.ring { border: 4px solid #a5fc22; box-shadow: inset 0 0 0 1.5px #30303a; opacity: 0; }
</style></head>
<body><div class="frame">
<div id="card" class="card" style="left:16px; top:16px; width:1110px; height:1048px; border-radius:40px"></div>
<img id="ph1" class="abs hide" src="../product-ui/mobile/screens/field-home.png" style="left:146px; top:70px; height:940px; border-radius:64px" alt="">
<div id="r1" class="abs ring" style="left:171px; top:513px; width:399px; height:82px; border-radius:14px"></div>
<div id="c1" class="abs hide" style="left:665.7045454545455px; top:510.77272727272725px; width:410.2954545454545px; color:var(--ink-700)"><div style="font-size:40px; line-height:1.05; font-weight:600; letter-spacing:-0.03em">Ready to start</div><div style="font-size:28px; line-height:1.25; margin-top:10px; color:var(--ink-500)">Unit 4B, Maple Court</div></div>
<img class="abs" src="../brand/logos/verstack-lockup-black.svg" style="left:900px; top:984px; height:34px" alt="Verstack">
<h1 id="t1" class="abs hide fit" style="left:1206px; top:96px; width:600px; line-height:0.98; text-wrap:balance; letter-spacing:-0.05em; font-weight:400; color:var(--mist)">The day&#8217;s work, in one list.</h1>
<div id="p1" class="abs hide" style="left:1206px; top:0px; width:600px; overflow:hidden; border-radius:24px; background:#fff"><img src="../product-ui/mobile/parts/record-summary.png" style="display:block; width:600px" alt=""></div>
<p id="t2" class="abs hide" style="left:1206px; top:0px; width:600px; font-size:34px; line-height:1.28; letter-spacing:-0.015em; color:var(--fg-muted)">Inspections, uploads and comments that need you, first thing.</p>
</div>
<script>
window.DURATION = 5.6;

function setup() { fitText(document.getElementById("t1"), 170, 60, 420); below("p1", "t1", 44); below("t2", "p1", 36); }
function renderAt(t) {
  enter(document.getElementById("card"), t, 0, 0.5, 0);
  enter(document.getElementById("t1"), t, 0.3);
  enter(document.getElementById("ph1"), t, 0.4, 0.7, 40);
  enter(document.getElementById("p1"), t, 1.0, 0.6, 24);
  enter(document.getElementById("t2"), t, 1.4);
  document.getElementById("r1").style.opacity = prog(t, 2.4, 0.3);
  enter(document.getElementById("c1"), t, 2.6, 0.48, 8);
}
window.addEventListener("load", () => {
  document.fonts.ready.then(() => {
    setup();
    window.READY = true;
    if (!location.search.includes("render")) {
      const start = performance.now();
      const loop = () => { renderAt(((performance.now() - start) / 1000) % (DURATION + 1.2)); requestAnimationFrame(loop); };
      loop();
    } else { renderAt(0); }
  });
});
</script>
</body></html>
