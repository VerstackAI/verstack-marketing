<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Decide from the phone</title>
<link rel="stylesheet" href="../templates/line.css">
<script src="motion.js"></script>
<style>body { background: var(--ground-900); margin: 0; } .frame { width: 1920px; height: 1080px; background: var(--ground-900); }
.hide { opacity: 0; }
.fit { overflow: hidden; }
.card { position: absolute; background: var(--mist); }
.sweep-clip { position: absolute; overflow: hidden; pointer-events: none; }
.sweep { position: absolute; top: 0; bottom: 0; left: -20%; width: 140%; opacity: 0.14; visibility: hidden;
  background: linear-gradient(90deg, #f8fafc 0%, #eefbd7 12%, #d8f7a3 26%, #baf85d 42%, #a5fc22 58%, #8ff741 74%, #7ff553 100%);
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.15) 7%, #000 22%, #000 78%, rgba(0,0,0,.15) 93%, transparent 100%); }
.leader { fill: none; stroke: #30303a; stroke-width: 1.5; }
.ring { border: 4px solid #a5fc22; box-shadow: inset 0 0 0 1.5px #30303a; opacity: 0; }
</style></head>
<body><div class="frame">
<div id="card" class="card" style="left:16px; top:16px; width:1110px; height:1048px; border-radius:40px"></div>
<img id="ph1" class="abs hide" src="../product-ui/mobile/screens/manager-work.png" style="left:146px; top:70px; height:940px; border-radius:64px" alt="">
<div class="abs" style="left:161px; top:85px; width:420px; height:910px; overflow:hidden; border-radius:49px"><div id="ph2" style="position:absolute; inset:0; overflow:hidden; opacity:0"><img src="../product-ui/mobile/screens/work-order.png" style="position:absolute; left:-15px; top:-15px; height:940px" alt=""></div></div>
<div id="r1" class="abs ring" style="left:171px; top:261px; width:399px; height:82px; border-radius:14px"></div>
<div id="r2" class="abs ring" style="left:171px; top:240px; width:399px; height:72px; border-radius:14px"></div>
<div id="c1" class="abs hide" style="left:665.7045454545455px; top:258.68181818181813px; width:410.2954545454545px; color:var(--ink-700)"><div style="font-size:40px; line-height:1.05; font-weight:600; letter-spacing:-0.03em">Owner asked</div><div style="font-size:28px; line-height:1.25; margin-top:10px; color:var(--ink-500)">Leaking water heater, Unit 4B</div></div>
<div id="c2" class="abs hide" style="left:665.7045454545455px; top:238.38636363636363px; width:410.2954545454545px; color:var(--ink-700)"><div style="font-size:40px; line-height:1.05; font-weight:600; letter-spacing:-0.03em">Decide the quote</div><div style="font-size:28px; line-height:1.25; margin-top:10px; color:var(--ink-500)">From the job, in one tap</div></div>
<img class="abs" src="../brand/logos/verstack-lockup-black.svg" style="left:900px; top:984px; height:34px" alt="Verstack">
<h1 id="t1" class="abs hide fit" style="left:1206px; top:96px; width:600px; line-height:0.98; text-wrap:balance; letter-spacing:-0.05em; font-weight:400; color:var(--mist)">Decide quotes from anywhere.</h1>
<p id="t2" class="abs hide" style="left:1206px; top:0px; width:600px; font-size:34px; line-height:1.28; letter-spacing:-0.015em; color:var(--fg-muted)">Requests that need an owner or manager wait in one list on their phone.</p>
</div>
<script>
window.DURATION = 7.0;

function setup() { fitText(document.getElementById("t1"), 170, 60, 520); below("t2", "t1", 40); }
function renderAt(t) {
  enter(document.getElementById("card"), t, 0, 0.5, 0);
  enter(document.getElementById("t1"), t, 0.3);
  enter(document.getElementById("t2"), t, 0.7);
  enter(document.getElementById("ph1"), t, 0.4, 0.7, 40);
  const r1 = document.getElementById("r1"), r2 = document.getElementById("r2"), c1 = document.getElementById("c1");
  r1.style.opacity = prog(t, 1.6, 0.3) * (1 - prog(t, 3.6, 0.2));
  enter(c1, t, 1.8, 0.48, 8);
  if (t >= 3.6) c1.style.opacity = 1 - prog(t, 3.6, 0.25);
  const push = ease(prog(t, 3.8, 0.55));
  const p2 = document.getElementById("ph2");
  p2.style.opacity = t >= 3.8 ? 1 : 0;
  p2.style.transform = `translateX(${(1 - push) * 420}px)`;
  r2.style.opacity = prog(t, 4.7, 0.3);
  enter(document.getElementById("c2"), t, 4.9, 0.48, 8);
}
window.addEventListener("load", () => {
  document.fonts.ready.then(() => {
    setup();
    window.READY = true;
    if (!location.search.includes("render")) {
      const start = performance.now();
      const loop = () => { renderAt(((performance.now() - start) / 1000) % (DURATION + 1.2)); requestAnimationFrame(loop); };
      loop();
    } else { renderAt(0); }
  });
});
</script>
</body></html>
