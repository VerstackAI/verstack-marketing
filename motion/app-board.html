<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Maintenance board</title>
<link rel="stylesheet" href="../templates/line.css">
<script src="motion.js"></script>
<style>body { background: var(--ground-900); margin: 0; } .frame { width: 1920px; height: 1080px; background: var(--ground-900); }
.hide { opacity: 0; }
.fit { overflow: hidden; }
.card { position: absolute; background: var(--mist); }
.sweep-clip { position: absolute; overflow: hidden; pointer-events: none; }
.sweep { position: absolute; top: 0; bottom: 0; left: -20%; width: 140%; opacity: 0.14; visibility: hidden;
  background: linear-gradient(90deg, #f8fafc 0%, #eefbd7 12%, #d8f7a3 26%, #baf85d 42%, #a5fc22 58%, #8ff741 74%, #7ff553 100%);
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.15) 7%, #000 22%, #000 78%, rgba(0,0,0,.15) 93%, transparent 100%); }
.leader { fill: none; stroke: #30303a; stroke-width: 1.5; }
.ring { border: 4px solid #a5fc22; box-shadow: inset 0 0 0 1.5px #30303a; opacity: 0; }
</style></head>
<body><div class="frame">
<div id="card" class="card" style="left:16px; top:16px; width:1110px; height:1048px; border-radius:40px"></div>
<div id="b1" class="abs hide" style="left:56px; top:56px; width:1030px; height:644px; overflow:hidden; border-radius:18px; border:1px solid #e2e8f0"><img id="bimg" src="../product-ui/desktop/screens/maintenance-board.png" style="position:absolute; left:0; top:0; width:1440px; transform-origin:0 0" alt=""></div>
<div id="r1" class="abs ring" style="border-radius:12px"></div>
<div id="c1" class="abs hide" style="left:72px; top:756px; width:998px; color:var(--ink-700)"><div style="font-size:40px; line-height:1.05; font-weight:600; letter-spacing:-0.03em">Active leak</div><div style="font-size:28px; line-height:1.25; margin-top:10px; color:var(--ink-500)">Kitchen faucet at King West 1708, flagged before a trade is booked.</div></div>
<img class="abs" src="../brand/logos/verstack-lockup-black.svg" style="left:72px; top:984px; height:34px" alt="Verstack">
<h1 id="t1" class="abs hide fit" style="left:1206px; top:96px; width:600px; line-height:0.98; text-wrap:balance; letter-spacing:-0.05em; font-weight:400; color:var(--mist)">Every work order on one board.</h1>
<div id="p1" class="abs hide" style="left:1206px; top:0px; width:600px; overflow:hidden; border-radius:24px; background:#fff"><img src="../product-ui/desktop/parts/work-order-card-leak.png" style="display:block; width:600px" alt=""></div>
</div>
<script>
window.DURATION = 6.4;

const BW = 1030, BH = 644, BX = 56, BY = 56, K0 = 0.7153, K1 = 1.45;
const L = [117, 411, 270, 149];
function setup() { fitText(document.getElementById("t1"), 170, 60, 460); below("p1", "t1", 44); }
function board(t) {
  // WHY: the full board at legible size is too small, so the camera moves in on the one card.
  const z = ease(prog(t, 1.4, 1.6));
  const s = K0 + (K1 - K0) * z;
  const fx = 720 + (L[0] + L[2] / 2 - 720) * z, fy = 450 + (L[1] + L[3] / 2 - 450) * z;
  let tx = BW / 2 - fx * s, ty = BH / 2 - fy * s;
  tx = Math.min(0, Math.max(BW - 1440 * s, tx)); ty = Math.min(0, Math.max(BH - 900 * s, ty));
  document.getElementById("bimg").style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  const r = document.getElementById("r1"), pad = 6;
  r.style.left = (BX + tx + L[0] * s - pad) + "px"; r.style.top = (BY + ty + L[1] * s - pad) + "px";
  r.style.width = (L[2] * s + 2 * pad) + "px"; r.style.height = (L[3] * s + 2 * pad) + "px";
  r.style.opacity = prog(t, 3.2, 0.3);
}
function renderAt(t) {
  enter(document.getElementById("card"), t, 0, 0.5, 0);
  enter(document.getElementById("t1"), t, 0.3);
  enter(document.getElementById("b1"), t, 0.4, 0.7, 30);
  board(t);
  enter(document.getElementById("c1"), t, 3.4, 0.48, 8);
  enter(document.getElementById("p1"), t, 4.0, 0.6, 24);
}
window.addEventListener("load", () => {
  document.fonts.ready.then(() => {
    setup();
    window.READY = true;
    if (!location.search.includes("render")) {
      const start = performance.now();
      const loop = () => { renderAt(((performance.now() - start) / 1000) % (DURATION + 1.2)); requestAnimationFrame(loop); };
      loop();
    } else { renderAt(0); }
  });
});
</script>
</body></html>
