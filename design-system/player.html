<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verstack motion player</title>
<!-- Plays one library clip full size: player.html?clip=draw-dishwasher&w=1920&h=1080
     motion/render.py opens this page with &render and steps renderAt(t) frame by frame. -->
<link rel="stylesheet" href="src/tokens.css">
<style>html, body { margin: 0; background: var(--ground-900); } #stage { width: max-content; }</style>
<script src="src/tokens.js"></script>
<script src="src/assets.js"></script>
<script src="src/engine.js"></script>
<script src="src/components.js"></script>
<script src="src/runtime.js"></script>
<script src="src/clips.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const id = q.get("clip") || VS.clips[0].id;
  const W = +(q.get("w") || 1920), H = +(q.get("h") || 1080);
  const m = await VS.mount(document.getElementById("stage"), id, { W, H });
  window.renderAt = m.render;
  window.DURATION = m.duration;
  window.CLIPS = VS.clips.map((c) => c.id);
  window.READY = true;
  if (!q.has("render")) VS.play(m);
})();
</script>
</body>
</html>
